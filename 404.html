<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>404 // Signal Lost — Vipin Vijay</title>
  <meta name="description" content="Coordinates out of bounds — 404 Orbital Signal Lost.">
  <meta name="theme-color" content="#05070a">

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305070a'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23e0231c'/%3E%3Crect x='5' y='7' width='22' height='2' fill='%23dfe7e0'/%3E%3C/svg%3E">

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Sans+JP:wght@300;400;500&family=Onest:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #05070a;
      --paper: #0b0f14;
      --txt: #dfe7e0;
      --muted: #7f8a84;
      --vermilion: #e0231c;
      --line: rgba(223, 231, 224, 0.12);
      --font-display: 'Onest', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --font-jp: 'Noto Sans JP', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--txt);
      font-family: var(--font-display);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      text-align: center;
      position: relative;
      overflow: hidden;
      background-image: 
        radial-gradient(rgba(224, 35, 28, 0.08) 1px, transparent 1px),
        radial-gradient(ellipse at 50% 30%, rgba(224, 35, 28, 0.06), transparent 60%);
      background-size: 32px 32px, 100% 100%;
    }

    .frame-container {
      max-width: 540px;
      padding: 3rem 2.5rem;
      background: rgba(11, 15, 20, 0.85);
      border: 1px solid var(--line);
      backdrop-filter: blur(16px);
      position: relative;
    }

    .frame-container::before {
      content: '';
      position: absolute;
      top: -1px;
      left: 20%;
      right: 20%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--vermilion), transparent);
    }

    .beacon {
      width: 56px;
      height: 56px;
      margin: 0 auto 1.75rem;
      position: relative;
    }

    .beacon svg {
      width: 100%;
      height: 100%;
      animation: spin 24s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      letter-spacing: 0.22em;
      color: var(--vermilion);
      margin-bottom: 0.75rem;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .eyebrow .jp {
      font-family: var(--font-jp);
      font-size: 0.8rem;
    }

    h1 {
      font-size: clamp(3rem, 10vw, 5.5rem);
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1;
      margin-bottom: 1rem;
      background: linear-gradient(180deg, #ffffff 0%, rgba(223, 231, 224, 0.45) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 2rem;
      font-weight: 300;
    }

    .btn-return {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 14px 28px;
      background: #ffffff;
      color: #05070a;
      text-decoration: none;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      border-radius: 2px;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-return:hover {
      background: var(--vermilion);
      color: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(224, 35, 28, 0.35);
    }

    .btn-return svg {
      transition: transform 0.2s ease;
    }

    .btn-return:hover svg {
      transform: translateX(-4px);
    }

    .meta {
      margin-top: 2rem;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: rgba(127, 138, 132, 0.6);
      letter-spacing: 0.15em;
    }
  </style>
</head>
<body>
  <div class="frame-container">
    <div class="beacon">
      <svg viewBox="0 0 48 48" fill="none">
        <circle cx="24" cy="24" r="22" stroke="rgba(223,231,224,0.2)" stroke-width="1.2" stroke-dasharray="3 3"/>
        <circle cx="24" cy="24" r="8" fill="#e0231c"/>
        <line x1="8" y1="24" x2="40" y2="24" stroke="#dfe7e0" stroke-width="1.2"/>
        <line x1="24" y1="8" x2="24" y2="40" stroke="#dfe7e0" stroke-width="1.2"/>
      </svg>
    </div>

    <div class="eyebrow">
      <span>SECTOR 404</span>
      <span>//</span>
      <span class="jp">軌道逸脱</span>
    </div>

    <h1>404</h1>

    <p>
      Coordinate Out of Bound. The celestial pathway or mission dossier you requested does not exist in this sector.
    </p>

    <a href="/" class="btn-return">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      <span>RETURN TO ORBIT 軌道</span>
    </a>

    <div class="meta">
      VIPIN VIJAY // CHENNAI, IN // CMRL INTERN
    </div>
  </div>
</body>
</html>
